<html th:replace="~{Admin/base::layout(~{::main})}">
	<body>
		<main class="font-[times]">
			<div class="mx-auto my-5 border border-gray-500 w-[95%] md:w-[90%] rounded-lg overflow-hidden">
				<div class="shadow-md">
					<div class="bg-blue-400 text-white text-center text-xl md:text-2xl p-3">
						<h4>Manage Products</h4>
					</div>

					<div class="overflow-x-auto">
						<table class="min-w-max text-center mx-auto my-5" id="example">
							<tr>
								<th class="border border-gray-500 px-3 py-2">Sr.no.</th>
								<th class="border border-gray-500 px-3 py-2">Product name</th>
								<th class="border border-gray-500 px-3 py-2">Product Description</th>
								<th class="border border-gray-500 px-3 py-2">Images</th>
								<th class="border border-gray-500 px-3 py-2">Category</th>
								<th class="border border-gray-500 px-3 py-2">Brand</th>
								<th class="border border-gray-500 px-3 py-2">Gender</th>
								<th class="border border-gray-500 px-3 py-2">Cost Price</th>
								<th class="border border-gray-500 px-3 py-2">Selling Price</th>
								<th class="border border-gray-500 px-3 py-2">Discount</th>
								<th class="border border-gray-500 px-3 py-2">Final Price</th>
								<th class="border border-gray-500 px-3 py-2">Colors</th>
								<th class="border border-gray-500 px-3 py-2">Sizes</th>
								<th class="border border-gray-500 px-3 py-2">Quantity</th>
								<th class="border border-gray-500 px-3 py-2">Shipping Charge</th>
								<th class="border border-gray-500 px-3 py-2">Delivery Time</th>
								<th class="border border-gray-500 px-3 py-2">Return Policy</th>
								<th class="border border-gray-500 px-3 py-2">Visibility</th>
								<th class="border border-gray-500 px-3 py-2">Added At</th>
								<th class="border border-gray-500 px-3 py-2">Status</th>
								<th class="border border-gray-500 px-3 py-2">Action</th>
							</tr>

							<tr th:each="product,srno :${products}" class="text-center">
								<td class="border border-gray-500 px-3 py-2" th:text="${srno.count}"></td>

								<td class="border border-gray-500 px-3 py-2 max-w-[200px] break-words"
									th:text="${product.productName}">
								</td>

								<td class="border border-gray-500 px-3 py-2 max-w-[300px] break-words"
									th:text="${product.productDescription}">
								</td>

								<td class="border border-gray-500 px-3 py-2">
									<img alt="Image not found"
										th:each="image : ${product.productImages}"
     									th:src="@{|/ProductImages/${image}|}"
										height="50"
										width="50"
										class="m-1 border rounded">
								</td>
								<td class="border border-gray-500 px-3 py-2"  th:text="${product.category.categoryName}"}>
								</td>

								<td class="border border-gray-500 px-3 py-2" th:text="${product.brandName}">
								</td>

								<td class="border border-gray-500 px-3 py-2"
								    th:text="${product.gender}">
								</td>
								
								<td class="border border-gray-500 px-3 py-2"
								    th:text="${product.costPrice}">
								</td>
								
								<td class="border border-gray-500 px-3 py-2"
								    th:text="${product.sellingPrice}">
								</td>
								
								<td class="border border-gray-500 px-3 py-2"
								    th:text="${product.discount + '%'}">
								</td>
								
								<td class="border border-gray-500 px-3 py-2"
								    th:text="${product.finalPrice}">
								</td>
								
								<td class="border border-gray-500 px-3 py-2"
								    th:text="${product.colors}">
								</td>
								
								<td class="border border-gray-500 px-3 py-2"
								    th:text="${product.sizes}">
								</td>
								
								<td class="border border-gray-500 px-3 py-2"
								    th:text="${product.quantity}">
								</td>
								
								<td class="border border-gray-500 px-3 py-2"
								    th:text="${product.shippingCharge}">
								</td>
								
								<td class="border border-gray-500 px-3 py-2"
								    th:text="${product.deliveryTime}">
								</td>
								
								<td class="border border-gray-500 px-3 py-2"
								    th:text="${product.returnPolicy}">
								</td>
								
								<td class="border border-gray-500 px-3 py-2"
								    th:text="${product.visiblity}">
								</td>
								
								<td class="border border-gray-500 px-3 py-2"
								    th:text="${#temporals.format(product.addedAt,'dd-MM-yyyy HH:mm')}">
								</td>
								
								<td class="border border-gray-500 px-3 py-2"
								    th:text="${product.status}">
								</td>
																<td class="border border-gray-500 px-3 py-2">
								    <div class="flex flex-col gap-2 items-center">
								
								        <a th:href="@{/Admin/view-product/{id}(id=${product.id})}"
								           class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 rounded text-sm w-20 text-center">
								            View
								        </a>
								
								        <a th:href="@{/Admin/edit-product/{id}(id=${product.id})}"
								           class="bg-yellow-500 hover:bg-yellow-600 text-white px-3 py-1 rounded text-sm w-20 text-center">
								            Edit
								        </a>
								
								        <form th:action="@{/Admin/delete-product/{id}(id=${product.id})}"
								              method="post"
								              onsubmit="return confirm('Are you sure you want to delete this product?');">
								
								            <button type="submit"
								                    class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-sm w-20">
								                Delete
								            </button>
								
								        </form>
								
								    </div>
								</td>
								
							</tr>
						</table>
					</div>
				</div>
			</div>
		</main>
	</body>
</html>
