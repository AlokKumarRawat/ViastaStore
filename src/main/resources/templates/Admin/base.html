<!doctype html>
<html lang="en" th:fragment="layout(content)">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Panel</title>
    <link href="/css/output.css" rel="stylesheet">
    <link href="/css/all.css" rel="stylesheet">
  </head>
  <body class="font-sans">
  	<div class="grid grid-cols-2 md:grid-cols-4 gap-5 border py-2 sticky bg-white z-50 top-0 relative">
  	
  		<div class="col-span-1 text-xl px-1 md:px-3 flex justify-center"> 
  		<span id="nav" class="lg:hidden"><i class=" fa-solid fa-bars m-2 mx-3"></i></span>
  		<span>ViastaStore</span>
  		</div>
  		<div class="hidden md:col-span-1 lg:col-span-2 md:block"></div>
  		<div class="col-span-1 md:col-span-2 lg:col-span-1 flex justify-right " id="profile">
  			<img alt="image not found" src="/images/profile.jpg" class="w-1/5 md:w-1/7 mx-1 md:mx-4 lg:w-1/6  rounded-[50%]">
  			<div class="px-2 py-1" th:text="${session.loggedInAdmin.name}"> </div><i class="fa-solid fa-caret-down mt-1 py-1 mx-3"></i>
  			
  		</div>
  		<div class="hidden absolute top-14 w-full md:w-2/3 lg:w-1/3 top-15 pt-2 border-b bg-white right-0  px-2" id="profile-desc">
  				<div class="grid grid-cols-4 gap-5 m-0">
  					<div class="col-span-1 pt-1"><img alt="image not found" src="/images/profile.jpg" class="w-full rounded-md"></div>
  					<div class="col-span-3">
  						<div th:text="${session.loggedInAdmin.name}">Name</div>
  						<div th:text="${session.loggedInAdmin.email}" class="">email@example.com</div>
  						<div class="border rounded-2xl p-1 bg-orange-400  text-center text-white"><a href="#">View Profile</a> </div>
  					 </div>
  				</div>
  				<div class="my-2"><a href="#">Change Password</a> </div>
  				<div class="my-2"><a href="/Admin/logout">Logout</a> </div>
  			</div>
  	</div>
  	<div class="grid grid-col-2 lg:grid-cols-4 relative">	
  		<div class="w-2/3 md:col-span-1 md:w-full bg-white lg:sticky absolute top-0 right-6 md:right-0 hidden lg:block left-0" id="nav-items">
  			<div class="grid grid-cols-3 border-b border-x">
  				<div class="col-span-1 p-2">
  					<img alt="Image not found" src="/images/profile.jpg" class="w-1/2 mx-3 rounded-[50%]">
  				</div>
  				<div class="col-span-2" >
  					<div th:text="${session.loggedInAdmin.name}">Name</div>
  					<div>Administrator</div>
  				</div>
  			</div>
  			<ul class="text-center list-none text-lg h-full  border-x border-b ">
  				<li class="py-3 pt-6"><a href="/Admin/Dashboard">Dashboard</a> </li>
  				<li class="py-3"><a href="/Admin/ManageUsers">Manage Users</a> </li>
  				<li class="py-3"><a href="/Admin/ManageOrders">Manage Orders</a> </li>
  				<li class="py-3"><a href="/Admin/AddCategory">Add Category</a> </li>
  				<li class="py-3"><a href="/Admin/AddProduct">Add Product</a> </li>
  				<li class="py-3"><a href="/Admin/ManageProduct">Manage Products</a> </li>
  				<li class="py-3"><a href="ViewEnquiry">Enquiries</a> </li>
  			</ul>
  		</div>
  		<div class="col-span-2 lg:col-span-3 main w-full bg-gray-200" >
    		<div th:replace="${content}"></div>
    	</div>
    </div>	
    <script type="text/javascript">
    document.getElementById("profile").addEventListener("click", () => {
        document.getElementById("profile-desc").classList.toggle("hidden");
    });
    document.getElementById("nav").addEventListener("click", () => {
        document.getElementById("nav-items").classList.toggle("hidden");
    });
    </script>
  </body>
</html>
