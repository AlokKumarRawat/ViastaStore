<html th:replace="~{Admin/base::layout(~{::main})}">
	<body>
		<main class="bg-gray-100 min-h-screen p-6">

    <!-- Header -->
    <div class="mb-6">
        <h1 class="text-3xl font-bold text-gray-800">Dashboard</h1>
        <p class="text-gray-500">Welcome to the Admin Panel</p>
    </div>

    <!-- Statistics -->
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-6">

        <div class="bg-white shadow rounded-lg p-5 border-l-4 border-blue-600">
            <p class="text-gray-500 text-sm">Total Products</p>
            <h2 class="text-3xl font-bold mt-2"
                th:text="${totalProducts}">0</h2>
        </div>

        <div class="bg-white shadow rounded-lg p-5 border-l-4 border-green-600">
            <p class="text-gray-500 text-sm">Total Orders</p>
            <h2 class="text-3xl font-bold mt-2"
                th:text="${totalOrders}">0</h2>
        </div>

        <div class="bg-white shadow rounded-lg p-5 border-l-4 border-yellow-500">
            <p class="text-gray-500 text-sm">Total Customers</p>
            <h2 class="text-3xl font-bold mt-2"
                th:text="${totalUsers}">0</h2>
        </div>

        <div class="bg-white shadow rounded-lg p-5 border-l-4 border-red-500">
            <p class="text-gray-500 text-sm">Total Revenue</p>
            <h2 class="text-3xl font-bold mt-2"
                th:text="'₹'+${totalRevenue}">₹0</h2>
        </div>

    </div>

    <!-- Bottom Section -->
    <div class="grid lg:grid-cols-3 gap-6 mt-8">

        <!-- Recent Orders -->
        <div class="lg:col-span-2 bg-white rounded-lg shadow">

            <div class="border-b p-4">
                <h2 class="text-xl font-semibold">Recent Orders</h2>
            </div>

            <div class="overflow-x-auto">

                <table class="w-full text-center">

                    <thead class="bg-gray-100">
                    <tr>
                        <th class="p-3">Order ID</th>
                        <th class="p-3">Customer</th>
                        <th class="p-3">Amount</th>
                        <th class="p-3">Status</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:if="${#lists.isEmpty(recentOrders)}">
                        <td colspan="4" class="py-10 text-gray-400">
                            No Orders Available
                        </td>
                    </tr>

                    <tr th:each="order : ${recentOrders}"
                        class="border-t hover:bg-gray-50">

                        <td class="p-3"
                            th:text="${order.orderId}"></td>

                        <td class="p-3"
                            th:text="${order.customerName}"></td>

                        <td class="p-3"
                            th:text="'₹'+${order.totalAmount}"></td>

                        <td class="p-3">
                            <span class="px-3 py-1 rounded-full text-sm bg-blue-100 text-blue-700"
                                  th:text="${order.orderStatus}">
                            </span>
                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

        <!-- Quick Actions -->
        <div class="bg-white rounded-lg shadow">

            <div class="border-b p-4">
                <h2 class="text-xl font-semibold">Quick Actions</h2>
            </div>

            <div class="p-5 space-y-4">

                <a href="/Admin/AddProduct"
                   class="block text-center bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg">
                    Add Product
                </a>

                <a href="/Admin/ManageProduct"
                   class="block text-center bg-green-600 hover:bg-green-700 text-white py-3 rounded-lg">
                    Manage Products
                </a>

                <a href="/Admin/AddCategory"
                   class="block text-center bg-yellow-500 hover:bg-yellow-600 text-white py-3 rounded-lg">
                    Add Categories
                </a>

                <a href="/Admin/ManageOrders"
                   class="block text-center bg-red-600 hover:bg-red-700 text-white py-3 rounded-lg">
                    Manage Orders
                </a>

            </div>

        </div>

    </div>

</main>
	</body>
</html>
