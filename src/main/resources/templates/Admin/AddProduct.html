<html th:replace="~{Admin/base::layout(~{::main})}">
<body>

<main class="font-[times]">

<div class="mx-auto my-5 border border-gray-500 w-4/5">
    <div class="shadow-md">

        <div class="bg-blue-400 text-white text-center text-xl md:text-2xl p-3">
            <h3>
                Add New Product
            </h3>
        </div>


        <div class="p-5">

            <form method="post" enctype="multipart/form-data">


                <h5 class="text-blue-500 text-xl mb-3">Product Information</h5>

                <div class="flex flex-wrap gap-5">

                    <div class="w-full md:w-[48%]">
                        <label class="block mb-1">Product Name</label>
                        <input type="text" name="productName"
                        class="border p-2 rounded-4xl w-full"
                        placeholder="Enter Product Name" required>
                    </div>


                    <div class="w-full md:w-[48%]">
                        <label class="block mb-1">Brand Name</label>
                        <input type="text" name="brandName"
                        class="border p-2 rounded-4xl w-full"
                        placeholder="Enter Brand Name" required>
                    </div>


                    <div class="w-full">
                        <label class="block mb-1">Product Description</label>

                        <textarea name="productDescription"
                        class="border p-2 rounded-xl w-full"
                        rows="4"
                        placeholder="Write Product Description"
                        required></textarea>

                    </div>

                </div>


                <hr class="my-5">


                <h5 class="text-blue-500 text-xl mb-3">Category Details</h5>


                <div class="flex flex-wrap gap-5">

                    <div class="w-full md:w-[48%]">
                        <label class="block mb-1">Category</label>

                        <select class="border p-2 rounded-4xl w-full" name="category" required>

                            <option value="">Select Category</option>

                            <option th:each="cat:${categories}"
                            th:value="${cat.id}"
                            th:text="${cat.categoryName}">
                            </option>

                        </select>

                    </div>


                    <div class="w-full md:w-[48%]">

                        <label class="block mb-1">Gender</label>

                        <select class="border p-2 rounded-4xl w-full"
                        name="gender" required>

                            <option value="" selected>Select</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Kids">Kids</option>

                        </select>

                    </div>

                </div>


                <hr class="my-5">


                <h5 class="text-blue-500 text-xl mb-3">Pricing Details</h5>


                <div class="flex flex-wrap gap-5">

                    <div class="w-full md:w-[23%]">
                        <label>Cost Price</label>
                        <input type="number" step="0.01"
                        class="border p-2 rounded-4xl w-full"
                        name="costPrice"
                        placeholder="0.0" required>
                    </div>


                    <div class="w-full md:w-[23%]">
                        <label>Selling Price</label>
                        <input type="number" step="0.01"
                        class="border p-2 rounded-4xl w-full"
                        name="sellingPrice"
                        id="sellingPrice"
                        placeholder="0.0"
                        required>
                    </div>


                    <div class="w-full md:w-[23%]">
                        <label>Discount (%)</label>
                        <input type="number"
                        class="border p-2 rounded-4xl w-full"
                        name="discount"
                        id="discount"
                        placeholder="0"
                        required>
                    </div>


                    <div class="w-full md:w-[23%]">
                        <label>Final Price</label>
                        <input type="number"
                        class="border p-2 rounded-4xl w-full"
                        id="finalPrice"
                        placeholder="0.0"
                        readonly>
                    </div>

                </div>


                <hr class="my-5">


                <h5 class="text-blue-500 text-xl mb-3">Product Variants</h5>


                <div class="flex flex-wrap gap-5">

                    <div class="w-full md:w-[48%]">
                        <label>Colors</label>

                        <input type="text"
                        class="border p-2 rounded-4xl w-full"
                        name="colors"
                        placeholder="Black, White, Red"
                        required>

                    </div>


                    <div class="w-full md:w-[48%]">

                        <label>Sizes</label>

                        <input type="text"
                        class="border p-2 rounded-4xl w-full"
                        name="sizes"
                        placeholder="S,M,L,XL,XXL"
                        required>

                    </div>

                </div>


                <hr class="my-5">


                <h5 class="text-blue-500 text-xl mb-3">Inventory</h5>


                <div class="flex flex-wrap gap-5">

                    <div class="w-full md:w-[23%]">
                        <label>Quantity</label>
                        <input type="number"
                        class="border p-2 rounded-4xl w-full"
                        name="quantity"
                        placeholder="0"
                        required>
                    </div>


                    <div class="w-full md:w-[23%]">
                        <label>Shipping Charge</label>
                        <input type="number"
                        class="border p-2 rounded-4xl w-full"
                        name="shippingCharge"
                        placeholder="0.0">
                    </div>


                    <div class="w-full md:w-[23%]">
                        <label>Delivery Time</label>
                        <input type="text"
                        class="border p-2 rounded-4xl w-full"
                        name="deliveryTime"
                        placeholder="2-5 Days">
                    </div>


                    <div class="w-full md:w-[23%]">
                        <label>Status</label>

                        <select class="border p-2 rounded-4xl w-full"
                        name="status">

                            <option value="Available">Available</option>
                            <option value="Out_of_Stock">Out of Stock</option>

                        </select>

                    </div>

                </div>


                <hr class="my-5">


                <h5 class="text-blue-500 text-xl mb-3">Product Images</h5>


                <input accept=".png, .jpg, .jpeg, .webp"
                class="border p-2 rounded-xl w-full"
                type="file"
                multiple
                name="images"
                required>


                <hr class="my-5">


                <h5 class="text-blue-500 text-xl mb-3">Options</h5>


                <div class="flex gap-10">

                    <label>
                        <input class="mx-2"
                        type="checkbox"
                        name="returnPolicy">
                        Return Available
                    </label>


                    <label>
                        <input class="mx-2"
                        type="checkbox"
                        checked
                        name="visibility">
                        Visible on Store
                    </label>

                </div>


                <hr class="my-5">


                <div class="text-center">

                    <button type="reset"
                    class="bg-gray-500 text-white rounded-4xl p-2 px-5 mx-2">
                        Reset
                    </button>


                    <button type="submit"
                    class="bg-green-500 text-white rounded-4xl p-2 px-5 mx-2">
                        Save Product
                    </button>

                </div>


            </form>

        </div>

    </div>

</div>


<script type="text/javascript">
	var discount=document.getElementById("discount");
	var sellingPrice=document.getElementById("sellingPrice");
	var finalPrice=document.getElementById("finalPrice");
	
	discount.addEventListener("keyup",()=>{
		finalPrice.value=sellingPrice.value-(sellingPrice.value*(discount.value/100));
	});
</script>


</main>

</body>
</html>
