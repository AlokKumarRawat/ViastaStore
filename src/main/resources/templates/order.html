<html th:replace="~{base::layout(~{::main})}">
	<body>
		<main>
						<div class="text-center p-10"
			     th:if="${#lists.isEmpty(orders)}">
			
			    <img src="/images/shopping-bags.png"
			         class="w-30 mx-auto">
			
			    <div class="text-3xl font-bold mt-5">
			
			        No Orders Yet
			
			    </div>
			
			    <div class="text-gray-500 mt-2">
			
			        You haven't placed any orders yet.
			
			    </div>
			
			    <a href="/shop"
			       class="inline-block bg-black text-white px-8 py-3 mt-5 rounded-lg">
			
			        Start Shopping
			
			    </a>
			
			</div>
			<div class="bg-[#f7f7f7] px-10 md:px-20 pt-5 md:py-10 border-y border-gray-500">
			
			    <div class="text-xl md:text-2xl lg:text-5xl">
			        My Orders
			    </div>
			
			    <div class="text-md md:text-lg font-[sans] text-[#9f9f9f]">
			        <a href="/">Home</a> / My Orders
			    </div>
			
			</div>
			
			<div class="w-4/5 mx-auto my-10">
			
			    <div class="border border-gray-500 rounded-xl my-5 p-5 grid grid-cols-5 gap-5"
			         th:each="order : ${orders}">
			
			        <!-- Image -->
			
			        <div class="col-span-5 md:col-span-1">
			
			            <img
			                th:src="@{'/ProductImages/'+${order.product.productImages.get(0)}}"
			                class="h-35 mx-auto">
			
			        </div>
			
			        <!-- Details -->
			
			        <div class="col-span-5 md:col-span-3">
			
			            <h3 class="text-2xl"
			                th:text="${order.product.productName}">
			            </h3>
			
			            <p class="text-gray-500 mt-2"
			               th:text="'Brand - '+${order.product.brandName}">
			            </p>
			
			            <p class="text-gray-500 mt-2">
			
			                <span th:text="${order.color}"></span>
			
			                |
			
			                <span th:text="${order.size}"></span>
			
			            </p>
			
			            <p class="mt-2">
			
			                Qty :
			                <span th:text="${order.quantity}"></span>
			
			            </p>
			
			            <h3 class="mt-3 text-xl">
			
			                ₹<span th:text="${order.finalPrice}"></span>
			
			            </h3>
			
			        </div>
			
			        <!-- Status -->
			
			        <div class="col-span-5 md:col-span-1 text-center">
			
			            <div class="border rounded-lg p-2"
			                 th:text="${order.orderStatus}">
			            </div>
			
			            <a th:href="@{'/order/'+${order.id}}"
			               class="block bg-black text-white rounded-lg p-2 mt-5">
			
			                View
			
			            </a>
			
			        </div>
			
			    </div>
			
			</div>
		</main>
	</body>
</html>
