<html>
<head>
	<title>Viasta | User Portal</title>
	<meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="css/output.css" rel="stylesheet">
    <link href="css/all.css" rel="stylesheet">
</head>
<body>
	<div class="bg-[#9f9f9f]">
		<div class="flex justify-center items-center h-full">
				<div class="shadow-md p-4 bg-white">
					<h3 class="font-mono">Verify your Otp here...</h3>
					<form action="/verify-otp" method="post">
						<label class="text-xl">Enter your otp</label>
						<input name="otp" type="text" class="mt-2 rounded-xl border p-2 text-xl" placeholder="otp">
						<div class="mt-4 text-center">
							<a href="/resend-otp" class="px-4 mx-4 text-white py-2 text-lg bg-gray-500 rounded-2xl">Resend OTP</a>
							<button type="submit" class="px-4 mx-4 text-white py-2 text-lg bg-gray-500 rounded-2xl">Verify OTP</button>
						</div>
					</form>
				</div>
		</div>
	</div>
	<script type="text/javascript">
		var msg="[[${msg}]]";
		if(msg!=""){
			alert(msg);
		}
	</script>
</body>
</html>
