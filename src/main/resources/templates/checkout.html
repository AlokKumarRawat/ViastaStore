<html th:replace="~{base::layout(~{::main})}">
<body>

<main class="max-w-7xl mx-auto p-5">

    <h2 class="text-3xl font-bold mb-6">
        Checkout
    </h2>

    <form>

        <div class="grid lg:grid-cols-3 gap-6">

            <!-- Left Side -->
            <div class="lg:col-span-2 border rounded-lg p-5">

                <!-- Saved Address -->
                <h3 class="text-2xl font-semibold mb-4">
                    Shipping Address
                </h3>

                <div class="space-y-4">

                    <div
                        th:each="add : ${addresses}"
                        class="border rounded-lg p-4">

                        <label class="flex gap-3 cursor-pointer">

                            <input
                                type="radio"
                                name="addressId"
                                th:value="${add.id}"
                                th:checked="${add.active}">

                            <div>

                                <h4
                                    class="font-semibold"
                                    th:text="${add.customerName}">
                                </h4>

                                <p th:text="${add.contactNo}"></p>

                                <p>

                                    <span th:text="${add.address}"></span>,
                                    
                                    -

                                    <span th:text="${add.pincode}"></span>

                                </p>

                            </div>

                        </label>

                    </div>

                </div>

                <!-- Add Address -->

                <div class="mt-5">

                    <a
                        href="/savedAddress"
                        class="border px-5 py-2 rounded hover:bg-black hover:text-white">

                        + Add New Address

                    </a>

                </div>

                <!-- Payment -->

                <h3 class="text-2xl font-semibold mt-10 mb-4">
                    Payment Method
                </h3>

                <div class="space-y-3">

                    <label class="block">

                        <input
                            type="radio"
                            name="payment"
                            value="COD"
                            checked>

                        Cash on Delivery

                    </label>

                    <label class="block">

                        <input
                            type="radio"
                            name="payment"
                            value="UPI">

                        UPI

                    </label>

                    <label class="block">

                        <input
                            type="radio"
                            name="payment"
                            value="CARD">

                        Debit / Credit Card

                    </label>

                </div>

            </div>

            <!-- Order Summary -->

            <div class="border rounded-lg p-5 h-fit">

                <h3 class="text-2xl font-semibold mb-5">
                    Order Summary
                </h3>

                <div class="space-y-3">

                    <div class="flex justify-between">

                        <span>Total Items</span>

                        <span th:text="${items}">
                        </span>

                    </div>

                    <div class="flex justify-between">

                        <span>Subtotal</span>

                        <span th:text="'₹'+${subtotal}">
                        </span>

                    </div>

                    <div class="flex justify-between">

                        <span>Delivery Charge</span>

                        <span>Free</span>

                    </div>

                    <hr>

                    <div class="flex justify-between text-xl font-bold">

                        <span>Total</span>

                        <span th:text="'₹'+${subtotal}">
                        </span>

                    </div>

                </div>

                <div class="mt-5 ">
                	<span onclick="checkout()"
                    class="mt-6 w-full bg-black text-white py-3 px-2 rounded-lg hover:bg-gray-800 cursor-pointer">

                    Place Order

                </span>
                </div>

            </div>

        </div>

    </form>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>

	function checkout(){
		
		const payment = document.querySelector('input[name="payment"]:checked').value;
		if (payment === "COD") {
	
		    console.log("Inside COD");

		    const address = document.querySelector('input[name="addressId"]:checked');

		    if (address == null) {
		        alert("Please select an address");
		        return;
		    }

		    console.log(address.value);

		    fetch("/placeOrder", {
		        method: "POST",
		        headers: {
		            "Content-Type": "application/x-www-form-urlencoded"
		        },
		        body: new URLSearchParams({
		            addressId: address.value
		        })
		    })
		    .then(response => {
		        console.log(response.status);
		        return response.text();
		    })
		    .then(result => {
		        console.log(result);

		        if (result === "success") {
		            alert("Order Successfully Placed");
		            window.location = "/MyOrders";
		        } else {
		            alert(result);
		        }
		    })
		    .catch(error => {
		        console.error(error);
		    });

		}
	else if(payment==="CARD"){
		alert("Payment by card is closed for now")
	}
	else{
	fetch("/payment/create")
	.then(r=>r.json())
	.then(data=>{

	new Razorpay({

	key:data.key,

	amount:data.amount,

	currency:"INR",

	order_id:data.orderId,

	name:"VIASTA",

	prefill:{
	name:data.name,
	email:data.email,
	contact:data.contact
	},

	handler:function(res){

	fetch("/payment/verify",{

	method:"POST",

	headers:{
	"Content-Type":"application/x-www-form-urlencoded"
	},

	body:new URLSearchParams({

	paymentId:res.razorpay_payment_id,
	orderId:res.razorpay_order_id,
	signature:res.razorpay_signature

	})

	})
	.then(r=>r.text())
	.then(result=>{

	if(result=="success"){
	
	alert("Payment Success, Order Confirmed");
	window.location="/MyOrders";

	}else{

	alert(result);

	}

	});

	}

	}).open();

	});

	}
	}
</script>

</main>

</body>
</html>
